<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:32px;font-weight:700}.sub{font-size:18px;fill:#526077}.h{font-size:21px;font-weight:700}.b{font-size:17px}.t{font-size:16px;fill:#526077}.box{fill:#fff;stroke:#5d6b82;stroke-width:2}.danger{fill:#fff2f2;stroke:#d64545;stroke-width:3}.handoff{fill:#eef6ff;stroke:#2d78c4;stroke-width:2}.note{font-size:17px;font-weight:700}</style>
  <rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="80" class="title">Xanh SM — Current-State Battery Incident Workflow</text><text x="80" y="115" class="sub">Baseline pilot assumption: 15 minutes per incident • HANDOFF • BOTTLENECK</text>
  <path d="M290 405H350M590 405H650M890 405H950M1190 405H1250" stroke="#526077" stroke-width="4"/><g fill="#526077"><path d="M350 395l20 10-20 10z"/><path d="M650 395l20 10-20 10z"/><path d="M950 395l20 10-20 10z"/><path d="M1250 395l20 10-20 10z"/></g>
  <g transform="translate(70 280)"><rect class="handoff" width="220" height="250" rx="16"/><text x="20" y="42" class="h">1. Receive report</text><text x="20" y="80" class="b">Driver calls / app report</text><text x="20" y="120" class="b">HANDOFF: driver → dispatcher</text><text x="20" y="160" class="t">Owner: Dispatcher</text><text x="20" y="195" class="t">Time: ~2 min</text></g>
  <g transform="translate(370 280)"><rect class="box" width="220" height="250" rx="16"/><text x="20" y="42" class="h">2. Verify data</text><text x="20" y="80" class="b">Check vehicle, GPS,</text><text x="20" y="106" class="b">battery and vehicle type</text><text x="20" y="160" class="t">Owner: Dispatcher</text><text x="20" y="195" class="t">Time: ~2 min</text></g>
  <g transform="translate(670 280)"><rect class="danger" width="220" height="250" rx="16"/><text x="20" y="42" class="h">3. Find station</text><text x="20" y="70" class="b">BOTTLENECK</text><text x="20" y="100" class="b">Search availability and</text><text x="20" y="126" class="b">compatible charging port</text><text x="20" y="170" class="t">Owner: Dispatcher</text><text x="20" y="205" class="t">Time: ~5 min</text></g>
  <g transform="translate(970 280)"><rect class="danger" width="220" height="250" rx="16"/><text x="20" y="42" class="h">4. Draft guidance</text><text x="20" y="70" class="b">BOTTLENECK</text><text x="20" y="100" class="b">Write route / safety</text><text x="20" y="126" class="b">message for driver</text><text x="20" y="170" class="t">Owner: Dispatcher</text><text x="20" y="205" class="t">Time: ~5 min</text></g>
  <g transform="translate(1270 280)"><rect class="handoff" width="220" height="250" rx="16"/><text x="20" y="42" class="h">5. Send or escalate</text><text x="20" y="80" class="b">Send after review, or</text><text x="20" y="106" class="b">call mobile charger</text><text x="20" y="145" class="b">HANDOFF: dispatcher → field</text><text x="20" y="190" class="t">Time: ~1 min</text></g>
  <rect x="70" y="640" width="1420" height="130" rx="16" fill="#fff6df" stroke="#d99b19" stroke-width="2"/><text x="100" y="685" class="note">Safety checkpoint</text><text x="100" y="725" class="b">If battery is below 5%, dispatcher requests a mobile charger; no station farther than 5 km is recommended.</text>
</svg>
